name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git tag --points-at HEAD | grep -Fx "${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag

      # A GitHub environment's deployment rules match a tag by name only; they cannot express
      # "this tag must point at a commit that is on main". Without this check, tagging a feature
      # branch would quietly produce a signed, published release of unreviewed code. Branch
      # protection on main is what makes the ancestry assertion meaningful.
      - name: Require the tag to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of main."
            echo "::error::Releases are cut from main only. Merge the change first, then tag the merge."
            exit 1
          fi

      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.AUTOSPEED_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .release-secrets
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode \
            > .release-secrets/autospeed-release.jks
          chmod 0600 .release-secrets/autospeed-release.jks

      - name: Build pinned development environment
        run: ./scripts/container-up

      - name: Build signed release APKs
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.AUTOSPEED_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSPEED_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSPEED_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Derive versionCode from the tag rather than from GITHUB_RUN_NUMBER. run_number is
          # scoped to a single workflow file, so renaming or recreating this file restarts it at
          # 1 -- and shipping versionCode 1 again makes Android treat the release as a downgrade
          # of every prior install, which republishing cannot undo. Deriving from the tag also
          # keeps the artifact reproducible from source. The tag was already constrained to
          # ^v[0-9]+\.[0-9]+\.[0-9]+$ above, so these components are known to be numeric.
          IFS=. read -r major minor patch <<<"${version}"
          # major <= 2099 keeps the largest encodable value (2099999999) under Android's
          # 2100000000 ceiling, so any tag this guard accepts is one both validators accept.
          if ((10#${major} > 2099 || 10#${minor} > 999 || 10#${patch} > 999)); then
            echo "::error::Tag ${GITHUB_REF_NAME} cannot be encoded as an Android versionCode."
            echo "::error::Requires major <= 2099 and minor/patch <= 999."
            exit 1
          fi
          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if ((version_code < 1)); then
            echo "::error::Tag ${GITHUB_REF_NAME} encodes to versionCode 0, which Android rejects."
            exit 1
          fi
          echo "Publishing ${GITHUB_REF_NAME} as versionName ${version} / versionCode ${version_code}."
          ./scripts/devcontainer exec \
            --workspace-folder "${GITHUB_WORKSPACE}" \
            --remote-env "AUTOSPEED_VERSION_NAME=${version}" \
            --remote-env "AUTOSPEED_VERSION_CODE=${version_code}" \
            --remote-env "AUTOSPEED_SIGNING_STORE_FILE=/workspaces/autospeed/.release-secrets/autospeed-release.jks" \
            --remote-env "AUTOSPEED_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}" \
            --remote-env "AUTOSPEED_SIGNING_KEY_ALIAS=${KEY_ALIAS}" \
            --remote-env "AUTOSPEED_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}" \
            ./scripts/release-build

      - name: Remove signing key
        if: always()
        run: rm -f .release-secrets/autospeed-release.jks

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --verify-tag \
            --generate-notes \
            --title "Autospeed ${GITHUB_REF_NAME}"
