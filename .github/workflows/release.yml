name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git tag --points-at HEAD | grep -Fx "${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag

      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.AUTOSPEED_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .release-secrets
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode \
            > .release-secrets/autospeed-release.jks
          chmod 0600 .release-secrets/autospeed-release.jks

      - name: Build pinned development environment
        run: ./scripts/container-up

      - name: Build signed release APKs
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.AUTOSPEED_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSPEED_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSPEED_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./scripts/devcontainer exec \
            --workspace-folder "${GITHUB_WORKSPACE}" \
            --remote-env "AUTOSPEED_VERSION_NAME=${version}" \
            --remote-env "AUTOSPEED_VERSION_CODE=${GITHUB_RUN_NUMBER}" \
            --remote-env "AUTOSPEED_SIGNING_STORE_FILE=/workspaces/autospeed/.release-secrets/autospeed-release.jks" \
            --remote-env "AUTOSPEED_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}" \
            --remote-env "AUTOSPEED_SIGNING_KEY_ALIAS=${KEY_ALIAS}" \
            --remote-env "AUTOSPEED_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}" \
            ./scripts/release-build

      - name: Remove signing key
        if: always()
        run: rm -f .release-secrets/autospeed-release.jks

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --verify-tag \
            --generate-notes \
            --title "Autospeed ${GITHUB_REF_NAME}"
